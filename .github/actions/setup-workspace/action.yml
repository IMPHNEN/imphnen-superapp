name: 'Set up workspace'
description: 'Install pnpm, Node, the workspace dependencies and the moon toolchain'

runs:
  using: 'composite'
  steps:
    - uses: pnpm/action-setup@v6
      with:
        version: 11.6.0

    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash

    - uses: moonrepo/setup-toolchain@v0
      with:
        auto-install: true
