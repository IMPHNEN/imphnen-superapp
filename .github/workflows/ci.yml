name: CI

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Check, typecheck, build (affected)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      - run: moon ci --color

  deploy-api:
    name: Deploy API
    needs: ci
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    uses: ./.github/workflows/deploy-api.yml
    secrets: inherit

  deploy-apps:
    name: Deploy apps
    needs: ci
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
