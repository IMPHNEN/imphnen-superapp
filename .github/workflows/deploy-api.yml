name: Deploy API to Cloudflare Workers

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  detect:
    if: ${{ vars.CLOUDFLARE_WORKERS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.pick.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=true
          elif git diff --name-only "$BEFORE..$SHA" | grep -qE '^(apps/api/|packages/(activity|contract|messages|permissions|schemas|version)/|package\.json$|pnpm-lock\.yaml$|\.github/workflows/deploy-api\.yml$)'; then
            changed=true
          else
            changed=false
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "API changed: $changed"

  deploy:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace

      - name: Typecheck and test
        run: moon run api:typecheck api:test --color

      - name: Apply D1 migrations
        run: moon run api:db-migrate-remote --color

      - name: Deploy the Worker
        run: moon run api:deploy --color
