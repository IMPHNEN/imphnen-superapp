name: Deploy API to Cloudflare Workers

on:
  push:
    branches: [develop]
    paths:
      - 'apps/api/**'
      - 'packages/activity/**'
      - 'packages/contract/**'
      - 'packages/messages/**'
      - 'packages/permissions/**'
      - 'packages/schemas/**'
      - 'packages/version/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.CLOUDFLARE_WORKERS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace

      - name: Typecheck and test
        run: moon run api:typecheck api:test --color

      - name: Apply D1 migrations
        run: moon run api:db-migrate-remote --color

      - name: Deploy the Worker
        run: moon run api:deploy --color
