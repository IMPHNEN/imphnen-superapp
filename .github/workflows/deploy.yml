name: Deploy apps to Cloudflare Workers

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      apps:
        description: 'JSON array of apps to deploy, e.g. ["landing"]. Empty deploys every app.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  ALL_APPS: '["landing","backoffice","dimentorin","gacha","hackathon","imphnenos","infra","qrcampaign"]'

jobs:
  detect:
    if: ${{ vars.CLOUDFLARE_WORKERS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.pick.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_APPS: ${{ inputs.apps }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            apps="${INPUT_APPS:-$ALL_APPS}"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            apps=$(.github/scripts/affected-apps.sh "$BEFORE..$SHA")
          else
            apps="$ALL_APPS"
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "Deploying: $apps"

  deploy:
    needs: detect
    if: needs.detect.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect.outputs.apps) }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace

      - name: Build and deploy ${{ matrix.app }}
        run: moon run ${{ matrix.app }}:deploy --color
        env:
          PUBLIC_API_URL: https://api.imphnen.dev
          VITE_API_URL: https://api.imphnen.dev
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
