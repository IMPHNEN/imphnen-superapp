$schema: 'https://moonrepo.dev/schemas/workspace.json'

projects:
  - 'apps/*'
  - 'packages/*'

vcs:
  client: 'git'
  defaultBranch: 'develop'

# infra -> identity (shared API vocabulary: schemas, contract, permissions, messages)
# ui -> service -> utils on the web side. Apps may use everything.
constraints:
  tagRelationships:
    infra: ['infra']
    identity: ['infra', 'identity']
    utils: ['utils']
    service: ['utils', 'identity', 'infra']
    ui: ['utils', 'service', 'identity', 'infra']
    app: ['utils', 'service', 'ui', 'identity', 'infra']
