$schema: 'https://moonrepo.dev/schemas/project.json'

id: 'dimentorin'
layer: 'application'
language: 'typescript'
tags: ['app']
stack: 'frontend'

tasks:
  dev:
    command: 'pnpm dev'
    options:
      persistent: true
      runInCI: false

  build:
    command: 'pnpm build'
    inputs:
      - '/packages/*/src/**/*'
      - 'src/**/*'
      - 'public/**/*'
      - 'index.html'
      - 'vite.config.*'
      - 'postcss.config.mjs'
      - 'package.json'
    outputs:
      - 'dist'

  preview:
    command: 'pnpm preview'
    deps: ['build']
    options:
      persistent: true
      runInCI: false

  typecheck:
    command: 'pnpm typecheck'
    inputs:
      - '/packages/*/src/**/*'
      - 'src/**/*'
      - 'tsconfig*.json'
      - 'package.json'
      - '/tsconfig.base.json'

  test:
    command: 'pnpm test'
    inputs:
      - 'src/**/*'
      - 'vite.config.*'
      - 'package.json'

  e2e:
    command: 'pnpm e2e'
    inputs:
      - 'e2e/**/*'
      - 'src/**/*'
      - 'playwright.config.ts'
    options:
      cache: false
      runInCI: false
