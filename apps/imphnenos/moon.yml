$schema: 'https://moonrepo.dev/schemas/project.json'

id: 'imphnenos'
layer: 'application'
language: 'typescript'
tags: ['app']
stack: 'frontend'

tasks:
  dev:
    command: 'pnpm dev'
    options:
      persistent: true
      runInCI: false

  build:
    command: 'pnpm build'
    inputs:
      - '/packages/*/src/**/*'
      - 'src/**/*'
      - 'public/**/*'
      - 'index.html'
      - 'vite.config.*'
      - 'postcss.config.mjs'
      - 'package.json'
    outputs:
      - 'dist'

  preview:
    command: 'pnpm preview'
    deps: ['build']
    options:
      persistent: true
      runInCI: false

  # Type errors predate the port (Nx never ran tsc). Re-enable in CI once clean.
  # Type errors predate the port (Nx never ran tsc); flip runInCI back once clean.
  typecheck:
    command: 'pnpm typecheck'
    inputs:
      - '/packages/*/src/**/*'
      - 'src/**/*'
      - 'tsconfig*.json'
      - 'package.json'
      - '/tsconfig.base.json'
    options:
      runInCI: false

  deploy:
    command: 'pnpm run deploy'
    deps: ['~:build']
    options:
      cache: false
      runInCI: false
