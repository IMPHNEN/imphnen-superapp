$schema: 'https://moonrepo.dev/schemas/project.json'

id: 'landing'
layer: 'application'
language: 'typescript'
tags: ['app']
stack: 'frontend'

tasks:
  dev:
    command: 'pnpm dev'
    options:
      persistent: true
      runInCI: false

  build:
    command: 'pnpm build'
    inputs:
      - 'src/**/*'
      - 'public/**/*'
      - 'astro.config.mjs'
      - 'package.json'
    outputs:
      - 'dist'

  preview:
    command: 'pnpm preview'
    deps: ['build']
    options:
      persistent: true
      runInCI: false

  typecheck:
    command: 'pnpm typecheck'
    inputs:
      - 'src/**/*'
      - 'tsconfig.json'
      - 'astro.config.mjs'
      - 'package.json'
      - '/tsconfig.base.json'
